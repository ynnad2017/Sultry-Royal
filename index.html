<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RS Sultry-Royal — Appointment Studio</title>
  <meta name="description" content="Massage appointment booking, client history, reminders and earnings for RS Sultry-Royal." />

  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Sultry-Royal" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <header class="masthead">
      <button id="settingsBtn" class="gear" type="button" data-action="nav" data-tab="settings" aria-label="Settings">⚙</button>
      <div class="logo">RS SULTRY-ROYAL<span class="rule"></span></div>
      <div class="subtitle">Massage Appointment Studio</div>
      <div class="subtitle manager">Managed by Malik</div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>

    <main id="view" role="tabpanel"></main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>

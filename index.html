<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Sultry-Royal" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>RS Sultry-Royal Appointment Reminder</title>

  <style>
    :root {
      --gold: #d4af37;
      --dark-gold: #9c7c19;
      --black: #121212;
      --card: #1f1f1f;
      --light: #f7f3e8;
      --danger: #d9534f;
      --green: #4caf50;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #080808, #29200d);
      color: var(--light);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      margin-bottom: 8px;
    }

    .subtitle {
      color: #ddd;
      font-size: 15px;
    }

    .card {
      background: rgba(31, 31, 31, 0.96);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h2 {
      color: var(--gold);
      margin-top: 0;
      font-family: Georgia, serif;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: #eee;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #111;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      margin-top: 18px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: var(--gold);
      color: #111;
      width: 100%;
    }

    .primary:hover {
      background: #f0cc4f;
    }

    .notify {
      background: #333;
      color: white;
      border: 1px solid var(--gold);
      width: 100%;
    }

    .appointment {
      border-left: 4px solid var(--gold);
      background: #292929;
      padding: 17px;
      border-radius: 8px;
      margin: 14px 0;
    }

    .appointment h3 {
      color: var(--gold);
      margin: 0 0 8px;
    }

    .appointment p {
      margin: 7px 0;
      line-height: 1.4;
    }

    .delete {
      background: var(--danger);
      color: white;
      padding: 9px 12px;
      margin-top: 10px;
    }

    .empty {
      color: #bbb;
      text-align: center;
      padding: 12px;
    }

    .status {
      text-align: center;
      color: #9be39b;
      margin-top: 10px;
      min-height: 20px;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .logo {
        font-size: 31px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RS Sultry-Royal">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="description" content="RS Sultry-Royal massage appointment reminder and booking app.">
<style>
  @media (max-width: 600px) {
    body { padding: 12px; padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .container { max-width: 100%; }
    .logo { font-size: 30px !important; letter-spacing: 2px !important; }
    .subtitle { font-size: 13px !important; }
    .card { padding: 16px !important; border-radius: 18px !important; }
    input, select, textarea, button { font-size: 16px !important; min-height: 48px; }
    .row { grid-template-columns: 1fr !important; gap: 0 !important; }
    .appointment { padding: 15px !important; }
  }
  button:active { transform: translateY(1px); }
</style>

</head>

<body>
  <div class="container">
    <header>
      <div class="logo">RS Sultry-Royal</div>
      <div class="subtitle">Massage Appointment Reminder</div>
      <div class="subtitle">Managed by Malik</div>
    </header>

    <section class="card">
      <h2>Book an Appointment</h2>

      <form id="appointmentForm">
        <label for="clientName">Client name</label>
        <input
          type="text"
          id="clientName"
          placeholder="Enter client name"
          required
        />

        <label for="clientPhone">Client contact number</label>
        <input
          type="tel"
          id="clientPhone"
          placeholder="+33 6 00 00 00 00"
          required
        />

        <label for="massage">Massage type</label>
        <select id="massage" required>
          <option value="">Select massage</option>
          <option value="Massage Swedish" data-price="100">
            Massage Swedish — €100
          </option>
          <option value="Massage deep tissues" data-price="150">
            Massage deep tissues — €150
          </option>
          <option value="Massage Swedish plus" data-price="180">
            Massage Swedish plus — €180
          </option>
        </select>

        <div class="row">
          <div>
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>

          <div>
            <label for="time">Appointment time</label>
            <input type="time" id="time" required />
          </div>
        </div>

        <label for="note">Note</label>
        <textarea
          id="note"
          placeholder="Add a note about the appointment..."
        ></textarea>

        <button class="primary" type="submit">
          Save Appointment
        </button>
      </form>

      <button class="notify" id="notificationButton">
        Enable Appointment Notifications
      </button>

      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <h2>Upcoming Appointments</h2>
      <div id="appointmentsList"></div>
    </section>
  </div>

  <script>
    const form = document.getElementById("appointmentForm");
    const massageSelect = document.getElementById("massage");
    const appointmentsList = document.getElementById("appointmentsList");
    const statusText = document.getElementById("status");
    const notificationButton = document.getElementById("notificationButton");

    let appointments =
      JSON.parse(localStorage.getItem("rsAppointments")) || [];

    function saveAppointments() {
      localStorage.setItem(
        "rsAppointments",
        JSON.stringify(appointments)
      );
    }

    function formatDateTime(date, time) {
      const dateTime = new Date(`${date}T${time}`);

      return dateTime.toLocaleString("en-US", {
        dateStyle: "full",
        timeStyle: "short",
        hour12: true
      });
    }

    function displayAppointments() {
      appointmentsList.innerHTML = "";

      if (appointments.length === 0) {
        appointmentsList.innerHTML =
          '<div class="empty">No appointments saved yet.</div>';
        return;
      }

      appointments.sort(
        (a, b) =>
          new Date(`${a.date}T${a.time}`) -
          new Date(`${b.date}T${b.time}`)
      );

      appointments.forEach((appointment) => {
        const item = document.createElement("div");
        item.className = "appointment";

        item.innerHTML = `
          <h3>${escapeHTML(appointment.massage)} — €${appointment.price}</h3>
          <p><strong>Client:</strong> ${escapeHTML(appointment.clientName)}</p>
          <p><strong>Contact:</strong> ${escapeHTML(appointment.clientPhone)}</p>
          <p><strong>Appointment:</strong>
            ${formatDateTime(appointment.date, appointment.time)}
          </p>
          <p><strong>Note:</strong>
            ${escapeHTML(appointment.note || "No note added")}
          </p>
          <button class="delete" onclick="deleteAppointment('${appointment.id}')">
            Delete
          </button>
        `;

        appointmentsList.appendChild(item);
      });
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const selectedMassage =
        massageSelect.options[massageSelect.selectedIndex];

      const appointment = {
        id: Date.now().toString(),
        clientName: document.getElementById("clientName").value,
        clientPhone: document.getElementById("clientPhone").value,
        massage: selectedMassage.value,
        price: selectedMassage.dataset.price,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        note: document.getElementById("note").value
      };

      appointments.push(appointment);
      saveAppointments();
      displayAppointments();
      scheduleReminder(appointment);

      form.reset();
      statusText.textContent =
        "Appointment saved successfully.";
    });

    function deleteAppointment(id) {
      appointments = appointments.filter(
        (appointment) => appointment.id !== id
      );

      saveAppointments();
      displayAppointments();
      statusText.textContent = "Appointment deleted.";
    }

    notificationButton.addEventListener("click", async () => {
      if (!("Notification" in window)) {
        statusText.textContent =
          "Notifications are not supported by this browser.";
        return;
      }

      const permission = await Notification.requestPermission();

      if (permission === "granted") {
        statusText.textContent =
          "Notifications enabled.";
      } else {
        statusText.textContent =
          "Notification permission was not granted.";
      }
    });

    function scheduleReminder(appointment) {
      const appointmentTime = new Date(
        `${appointment.date}T${appointment.time}`
      );

      // Reminder 30 minutes before the appointment
      const reminderTime =
        appointmentTime.getTime() - 30 * 60 * 1000;

      const delay = reminderTime - Date.now();

      if (delay > 0 && delay < 2147483647) {
        setTimeout(() => {
          if (
            "Notification" in window &&
            Notification.permission === "granted"
          ) {
            new Notification("RS Sultry-Royal Reminder", {
              body:
                `${appointment.clientName}'s ` +
                `${appointment.massage} appointment is in 30 minutes.`
            });
          } else {
            alert(
              `Reminder: ${appointment.clientName}'s appointment ` +
              `is in 30 minutes.`
            );
          }
        }, delay);
      }
    }

    function scheduleAllReminders() {
      appointments.forEach(scheduleReminder);
    }

    displayAppointments();
    scheduleAllReminders();
  // Make the site installable as an iPhone/iPad Home Screen web app when hosted over HTTPS.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
